<!DOCTYPE html>
<html lang="it">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="img/bug.ico">
	<title>Bug Report</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-image: url(img/backgrounds/mainMenu-background.webp);
			background-size: cover;
			background-repeat: no-repeat;
			background-position: center;
			margin: 0;
			padding: 0;
			color: white;
		}

		.container {
			background-color: rgba(94, 94, 94, 0.1);
			backdrop-filter: blur(20px);
			box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
			max-width: 700px;
			margin: 50px auto;
			padding: 30px 40px;
			border-radius: 8px;
		}

		h1 {
			color: white;
			margin-bottom: 10px;
			font-weight: 600;
		}

		p.lead {
			font-size: 1.1em;
			margin-bottom: 30px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font-weight: 600;
		}

		input[type="text"], input[type="email"], select, textarea {
			width: 100%;
			padding: 20px 20px;
			margin-top: 10px;
			margin-bottom: 20px;
			border-radius: 40px;
			font-size: 16px;
			border: 2px solid rgba(255, 255, 255, 0.2);
			background: transparent;
			color: white;
			outline: none;
			box-sizing: border-box;
		}

		button {
			display: inline-block;
			background-color: rgba(0, 0, 0, 0.7);
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			width: 100%;
			cursor: pointer;
			font-size: 16px;
			transition: background-color 0.3s, transform 0.2s ease-in-out;
		}

		button:hover {
			background-color: rgba(0, 0, 0, 0.9);
			transform: scale(1.1);
		}

		select option {
			cursor: pointer;
			color: white;
			background-color: #333;
		}
	</style>
</head>

<body>
	<div class="container">
		<h1>Bug Report</h1>
		<p class="lead">Per favore, compila il modulo sottostante per segnalarci un problema riscontrato.</p>
		<form id="bug-form">
			<label for="name">Nome</label>
			<input type="text" id="name" name="name" placeholder="Il tuo nome" required />

			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="La tua email" required />

			<label for="bug-type">Tipo di bug</label>
			<select id="bug-type" name="bug-type" required>
				<option value="" disabled selected>Seleziona un tipo</option>
				<option value="ui">Interfaccia Utente</option>
				<option value="performance">Performance</option>
				<option value="security">Sicurezza</option>
				<option value="crash">Crash / Arresto</option>
				<option value="other">Altro</option>
			</select>

			<label for="description">Descrizione del problema</label>
			<textarea id="description" name="description" rows="6" placeholder="Descrivi dettagliatamente il problema"
				required></textarea>

			<button type="submit">Invia Segnalazione</button>
		</form>
	</div>
	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const form = document.getElementById('bug-form');

			form.addEventListener('submit', async (event) => {
				event.preventDefault();

				const formData = new FormData(form);
				const data = {};
				formData.forEach((value, key) => (data[key] = value));

				try {
					const response = await fetch('https://api.playscopa.online/bug-report', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(data)
					});
					const result = await response.json();

					if (response.ok) {
						alert(result.message);
						form.reset();
					} else {
						alert('Errore: ' + result.message);
					}
				} catch (error) {
					alert('Errore di rete o server, riprova più tardi.');
				}
			});
		});
	</script>
</body>

</html>
